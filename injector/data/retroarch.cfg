# Seed configuration for single-game ("injected") CIAs.
#
# Packed as romfs:/game/retroarch.cfg and copied to <data_dir>/retroarch.cfg
# the first time the game boots. From then on that copy is the one in use,
# so changes made in the menu are kept per game.

# Only what makes sense for a single game is left in the menu.
kiosk_mode_enable = "true"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_information = "false"
menu_show_configurations = "false"
quick_menu_show_close_content = "false"

# No history or playlists for a one-game app.
history_list_enable = "false"
content_runtime_log = "false"

menu_driver = "rgui"
config_save_on_exit = "true"
pause_nonactive = "true"
savestate_thumbnail_enable = "false"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3ds-new-retroarch-forwarder"
dynamic = ["version"]
description = "Build 3DS forwarder CIAs that launch one game with its RetroArch core"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "manu-romero-411" }]
keywords = ["3ds", "retroarch", "forwarder", "cia", "luma3ds", "steamgriddb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = ["requests>=2.28", "Pillow>=10.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pylint>=3", "pytest>=7", "black>=24"]

[project.scripts]
3ds-forwarder = "forwarder3ds.cli:main"

[project.gui-scripts]
3ds-forwarder-gui = "forwarder3ds.gui.app:main"

[project.urls]
Homepage = "https://github.com/manu-romero-411/3ds-new-retroarch-forwarder"

# The version is the git tag (v1.2.3); nothing in the tree holds it.
[tool.setuptools_scm]
version_file = "src/forwarder3ds/_version.py"
version_file_template = """\"\"\"Written at build time from the git tag; do not edit.\"\"\"

__version__ = version = "{version}"
"""
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forwarder3ds.data" = [
    "*.json",
    "*.rsf",
    "*.png",
    "icons/*.svg",
    "jingles/*",
    "platform_logos/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.11"
# Generated at build time (see forwarder3ds/version.py), not hand-written code.
ignore = ["_version.py"]
# PySide6 is a compiled extension: without this pylint cannot see its classes.
extension-pkg-allow-list = ["PySide6"]

[tool.pylint.typecheck]
# Qt signals are objects created by the binding at runtime.
generated-members = ["connect", "disconnect", "emit"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
# Binary format parsers and Qt panels genuinely hold many locals/attributes.
max-attributes = 18
max-locals = 25
max-args = 7
max-positional-arguments = 7
min-public-methods = 0

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.pylint.basic]
good-names = ["f", "i", "n"]

[tool.black]
line-length = 100
target-version = ["py311"]

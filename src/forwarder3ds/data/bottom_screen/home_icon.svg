<?xml version="1.0" encoding="UTF-8"?>
<!-- HOME icon of the touch screen's footer ("⌂: Return to HOME Menu").
     Drawn square, at the height of the footer's capitals plus 3 pixels; only
     its shape (alpha) counts, the footer's grey fills it. After editing it,
     run scripts/render_home_icon.py to refresh home_icon.png, which the
     command-line tool uses when Qt is not installed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16">
  <path
     d="M 8,2 1.5,8 V 9 H 3 V 14 H 13 V 9 H 14.5 V 8 Z M 5.5,9 V 13 H 10.5 V 9 Z"
     fill="#000000" fill-rule="evenodd"
     stroke="#000000" stroke-width="1.2" stroke-linejoin="round" />
</svg>

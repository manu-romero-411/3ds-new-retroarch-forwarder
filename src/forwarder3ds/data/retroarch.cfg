# Seed configuration of every injected CIA.
#
# Packed as romfs:/retroarch.cfg and copied to <data_dir>/retroarch.cfg the
# first time the game boots. From then on that copy is the one in use, so
# changes made in the menu are kept per game. Delete it to start over.
# The builder appends the lines that depend on the game (its data_dir and
# screen settings).

# --- Startup ------------------------------------------------------------------
# The core info folder is in the RomFS and has nothing to cache.
core_info_cache_enable = "false"
history_list_enable = "false"
content_runtime_log = "false"
content_runtime_log_aggregate = "false"

# --- Menu: as close to a single pause menu as RetroArch allows ---------------
# The touch screen shows Resume / Save state / Load state (RetroArch's 3DS
# bottom menu); the top screen keeps a trimmed Quick Menu.
kiosk_mode_enable = "true"
menu_driver = "rgui"
menu_show_sublabels = "false"
# Confirm with A (right) and go back with B (bottom), as on the 3DS.
menu_swap_ok_cancel_buttons = "false"
# Black theme (rgui_theme.cfg in the RomFS), no checkerboard or border.
rgui_menu_color_theme = "0"
rgui_menu_theme_preset = "romfs:/rgui_theme.cfg"
rgui_background_filler_thickness_enable = "false"
rgui_border_filler_enable = "false"
rgui_border_filler_thickness_enable = "false"
rgui_particle_effect = "0"

# Main menu: only Quick Menu and Quit RetroArch remain.
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_load_disc = "false"
menu_show_dump_disc = "false"
menu_show_eject_disc = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_information = "false"
menu_show_configurations = "false"
menu_show_help = "false"
menu_show_restart_retroarch = "false"
menu_show_reboot = "false"
menu_show_shutdown = "false"

# Tabs (RGUI shows them as main menu entries).
content_show_settings = "false"
content_show_history = "false"
content_show_favorites = "false"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
content_show_playlists = "false"
content_show_explore = "false"
content_show_add_entry = "0"
content_show_contentless_cores = "0"

# Quick Menu: resume, restart, save/load state, screenshot, core options,
# controls. Save states are listed inline instead of in a submenu.
quick_menu_show_close_content = "false"
quick_menu_show_savestate_submenu = "false"
quick_menu_show_undo_save_load_state = "false"
quick_menu_show_replay = "false"
quick_menu_show_add_to_favorites = "false"
quick_menu_show_add_to_playlist = "false"
quick_menu_show_start_recording = "false"
quick_menu_show_start_streaming = "false"
quick_menu_show_set_core_association = "false"
quick_menu_show_reset_core_association = "false"
quick_menu_show_core_options_flush = "false"
quick_menu_show_cheats = "false"
quick_menu_show_shaders = "false"
quick_menu_show_save_core_overrides = "false"
quick_menu_show_save_content_dir_overrides = "false"
quick_menu_show_save_game_overrides = "false"
quick_menu_show_information = "false"
quick_menu_show_download_thumbnails = "false"
quick_menu_show_game_ai = "false"

# --- One flat folder per game -------------------------------------------------
# game.srm, game.state*, game.opt... straight in <data_dir>, no subfolders
# per core, and a single core options file (path appended below).
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"
sort_screenshots_by_content_enable = "false"
game_specific_options = "false"
global_core_options = "true"

# --- Bezel ---------------------------------------------------------------------
# RetroArch turns the overlay on by itself when the game has a bezel.png
# (in its save folder or in the CIA), and off when it has none.
input_overlay_opacity = "1.000000"
input_overlay_show_inputs = "0"

# --- Behaviour ----------------------------------------------------------------
config_save_on_exit = "true"
pause_nonactive = "true"
# The game's control remap (game.rmp) loads on every boot: no toast for it.
notification_show_remap_load = "false"
# The bottom menu shows the save state's thumbnail.
savestate_thumbnail_enable = "true"

# RGUI colour theme of every game: black at 75 % (the paused game shows
# through), grey text, white selection. Colours are 0xAARRGGBB. The CIA
# carries this file in its RomFS; the game's retroarch.cfg points at it
# (rgui_menu_theme_preset).
rgui_entry_normal_color = "0xFFAAAAAA"
rgui_entry_hover_color = "0xFFFFFFFF"
rgui_title_color = "0xFFFFFFFF"
rgui_bg_dark_color = "0xC0000000"
rgui_bg_light_color = "0xC0000000"
rgui_border_dark_color = "0xC0000000"
rgui_border_light_color = "0xC0000000"
rgui_shadow_color = "0xFF000000"
rgui_particle_color = "0xFF333333"

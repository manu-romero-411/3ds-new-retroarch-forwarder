<?xml version="1.0" encoding="UTF-8"?>
<!-- Application icon of 3ds-new-retroarch-forwarder. Edit it directly (e.g. in
     Inkscape); the PNG sizes are rendered from it when packaging. Keep it
     renderable by Qt's SVG engine: no masks or clip paths. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5ea3"/>
      <stop offset="1" stop-color="#232f57"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#d5dbe8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc24b"/>
      <stop offset="1" stop-color="#ff8a1c"/>
    </linearGradient>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="background">
    <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="console">
    <!-- lid with the top screen -->
    <rect x="22" y="15" width="84" height="49" rx="8" fill="url(#shell)"/>
    <rect x="31" y="22" width="66" height="36" rx="3" fill="#1b2238"/>
    <!-- hinge -->
    <rect x="26" y="64" width="76" height="7" rx="3" fill="#aeb7cb"/>
    <!-- base with the bottom screen and buttons -->
    <rect x="22" y="71" width="84" height="43" rx="8" fill="url(#shell)"/>
    <rect x="42" y="77" width="44" height="30" rx="2" fill="#2c3a66"/>
    <path d="M30 86h3v-3h3v3h3v3h-3v3h-3v-3h-3z" fill="#5b6787"/>
    <circle cx="94" cy="83" r="2.2" fill="#5b6787"/>
    <circle cx="94" cy="93" r="2.2" fill="#5b6787"/>
    <circle cx="89" cy="88" r="2.2" fill="#5b6787"/>
    <circle cx="99" cy="88" r="2.2" fill="#5b6787"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="forward arrow">
    <path d="M48 31h18v-6l15 15-15 15v-6H48z" fill="url(#arrow)"/>
    <!-- icon tile on the bottom screen -->
    <rect x="57" y="83" width="14" height="14" rx="3" fill="#ff9f1c"/>
    <rect x="55" y="81" width="18" height="18" rx="4" fill="none" stroke="#4fb3ff" stroke-width="1.6"/>
  </g>
</svg>

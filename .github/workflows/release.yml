# On a new v* tag pointing at main: lint and test, work out the target
# distributions, compile the RetroArch bases once, build and test one package per
# distribution and architecture (each inside its own container, on a runner
# of that architecture), an AppImage per architecture and the Windows x64
# zip, and publish a GitHub release with all of them plus install.sh. Plain commits do not trigger it. It can also be started by
# hand (Actions › Release › Run workflow) for an existing tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PACKAGE_MAINTAINER: ${{ vars.PACKAGE_MAINTAINER || 'manu-romero-411 <manu-romero-411@users.noreply.github.com>' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0  # full history to check the tag against main

      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${TAG} does not point at a commit of main"
            exit 1
          fi

      # The tag is the version (nothing in the tree holds it): v1.2.3 -> 1.2.3.
      - name: Tag is a version
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Tag ${TAG} is not a version like v1.2.3"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: pip install -e '.[gui,dev]'

      - name: pylint
        run: pylint src/forwarder3ds tests scripts packaging/targets.py

      - name: pytest
        run: QT_QPA_PLATFORM=offscreen pytest -q

      - name: shellcheck
        run: shellcheck -x install.sh packaging/*.sh packaging/toolchain/*.sh packaging/ci/*.sh packaging/appimage/*.sh packaging/windows/*.sh packaging/deb/postinst packaging/deb/prerm

  targets:
    name: Target distributions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Debian stable, two latest Ubuntu LTS, two latest Fedora
        id: targets
        run: python3 packaging/targets.py

  bases:
    name: Compile the RetroArch bases (devkitARM)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Build every core in retroarch/cores
        run: |
          packaging/toolchain/build-base.sh build/bases-toolchain all
          cp build/bases-toolchain/VERSIONS build/bases-toolchain/bases/VERSIONS
          mkdir -p dist-bases
          tar -C build/bases-toolchain -czf dist-bases/retroarch-bases.tar.gz bases

      - uses: actions/upload-artifact@v7
        with:
          name: bases
          path: dist-bases/*
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: [check, targets, bases]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: bases
          path: dist-bases

      - name: Build in ${{ matrix.image }}
        run: |
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e PACKAGE_VERSION="${TAG#v}" -e PACKAGE_MAINTAINER \
            -v "${PWD}:/src" -w /src "${{ matrix.image }}" \
            bash packaging/ci/build-package.sh "${{ matrix.format }}" "${{ matrix.suffix }}"
          ls -l dist

      - name: Install and use it in a clean ${{ matrix.image }}
        run: |
          package="$(ls dist/*."${{ matrix.format }}")"
          docker run --rm -e EXPECTED_VERSION="${TAG#v}" -v "${PWD}:/src:ro" -w /src \
            "${{ matrix.image }}" bash packaging/ci/smoke-test.sh "${package}"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: dist/*.${{ matrix.format }}
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: [check, bases]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          name: bases
          path: dist-bases

      # Built on the oldest Ubuntu still supported, so it runs on older systems.
      - name: Build in ubuntu:22.04
        run: |
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e PACKAGE_VERSION="${TAG#v}" -v "${PWD}:/src" -w /src ubuntu:22.04 \
            bash packaging/appimage/build-appimage.sh
          ls -l dist

      - name: It starts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          appimage="$(ls dist/*.AppImage)"
          chmod +x "${appimage}"
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --cli --version
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --cli doctor --offline

      - uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [check, bases]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          name: bases
          path: dist-bases

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git make mingw-w64-x86_64-gcc

      - name: makerom.exe and bannertool.exe
        shell: msys2 {0}
        run: packaging/toolchain/build-tools.sh --static build/windows-tools

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Freeze and zip
        shell: bash
        env:
          PACKAGE_VERSION: ${{ env.TAG }}
        run: packaging/windows/build-windows.sh build/windows-tools

      - name: It starts
        shell: bash
        run: |
          "build/windows-dist/3DS Forwarder/cli/3ds-forwarder.exe" --version
          "build/windows-dist/3DS Forwarder/cli/3ds-forwarder.exe" doctor --offline
          "build/windows-dist/3DS Forwarder/cli/3ds-forwarder.exe" --version | grep -qv unknown
          # The GUI: open its window and quit. Started from a shell it logs to
          # the inherited stderr; from Explorer, to its log file.
          FORWARDER3DS_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen \
            timeout 180 "build/windows-dist/3DS Forwarder/3DS Forwarder.exe"
          cat "${LOCALAPPDATA}/3ds-forwarder/3ds-forwarder.log" 2> /dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [package, appimage, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: bases
          path: dist-bases

      - name: Assets and checksums
        run: |
          cp install.sh dist-bases/retroarch-bases.tar.gz dist/
          cd dist
          sha256sum ./*.deb ./*.rpm ./*.AppImage ./*.zip install.sh retroarch-bases.tar.gz \
            | sed 's| \./| |' > SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip
            dist/install.sh
            dist/retroarch-bases.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

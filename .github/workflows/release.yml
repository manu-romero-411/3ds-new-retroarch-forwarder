# On a new v* tag pointing at main: lint and test, work out the target
# distributions, compile the stub once, build and test one package per
# distribution and architecture (each inside its own container, on a runner
# of that architecture) and publish a GitHub release with all of them plus
# install.sh. Plain commits do not trigger it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PACKAGE_MAINTAINER: ${{ vars.PACKAGE_MAINTAINER || 'manu-romero-411 <manu-romero-411@users.noreply.github.com>' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history to check the tag against main

      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point at a commit of main"
            exit 1
          fi

      - name: Tag matches __version__
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/forwarder3ds/__init__.py)"
          if [[ "${GITHUB_REF_NAME#v}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi

      - name: Stub core table matches cores.json
        run: |
          python3 scripts/generate_cores_table.py src/forwarder3ds/data/cores.json \
            | diff -u stub/source/cores_table.h - \
            || { echo "::error::Regenerate stub/source/cores_table.h from cores.json"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: pip install -e '.[gui,dev]'

      - name: pylint
        run: pylint src/forwarder3ds tests scripts packaging/targets.py

      - name: pytest
        run: QT_QPA_PLATFORM=offscreen pytest -q

      - name: shellcheck
        run: shellcheck -x install.sh packaging/*.sh packaging/toolchain/*.sh packaging/ci/*.sh packaging/deb/postinst packaging/deb/prerm

  targets:
    name: Target distributions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Debian stable, two latest Ubuntu LTS, two latest Fedora
        id: targets
        run: python3 packaging/targets.py

  stub:
    name: Compile the stub (devkitARM)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe names the stub's revision

      - name: Build
        run: |
          packaging/toolchain/build-stub.sh build/stub-toolchain
          mkdir -p dist-stub
          cp build/stub-toolchain/stub/3ds-forwarder-stub.elf build/stub-toolchain/VERSIONS dist-stub/

      - uses: actions/upload-artifact@v7
        with:
          name: stub
          path: dist-stub/*
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: [check, targets, stub]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: stub
          path: dist-stub

      - name: Build in ${{ matrix.image }}
        run: |
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e PACKAGE_MAINTAINER -v "${PWD}:/src" -w /src "${{ matrix.image }}" \
            bash packaging/ci/build-package.sh "${{ matrix.format }}" "${{ matrix.suffix }}"
          ls -l dist

      - name: Install and use it in a clean ${{ matrix.image }}
        run: |
          package="$(ls dist/*."${{ matrix.format }}")"
          docker run --rm -v "${PWD}:/src:ro" -w /src "${{ matrix.image }}" \
            bash packaging/ci/smoke-test.sh "${package}"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: dist/*.${{ matrix.format }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: stub
          path: dist-stub

      - name: Assets and checksums
        run: |
          cp install.sh dist-stub/3ds-forwarder-stub.elf dist/
          cd dist
          sha256sum ./*.deb ./*.rpm install.sh 3ds-forwarder-stub.elf | sed 's| \./| |' > SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/install.sh
            dist/3ds-forwarder-stub.elf
            dist/SHA256SUMS
          generate_release_notes: true
